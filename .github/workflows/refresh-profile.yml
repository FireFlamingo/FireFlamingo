name: Refresh contribution trace

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_assets.py
      - .github/workflows/refresh-profile.yml
      - tests/test_profile.py

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build from public GitHub activity
        run: python scripts/build_assets.py
      - name: Verify calendar and README behavior
        run: python -m unittest discover -s tests -v
      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution trace'
            git pull --rebase origin main
            git push
          fi
